<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Langit — Info Cuaca</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #eef4fb;
        --card: #fff;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --accent: #1d4ed8;
        --border: #d9e2ec;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #eef4fb, #dbeafe);
        min-height: 100vh;
        color: var(--ink);
        padding: 32px 20px;
      }
      .wrap {
        max-width: 760px;
        margin: auto;
      }
      .back {
        display: inline-block;
        margin-bottom: 24px;
        font-size: 0.85rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 26px;
      }

      .search-row {
        display: flex;
        gap: 10px;
        margin-bottom: 26px;
      }
      .search-row input {
        flex: 1;
        padding: 14px 18px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        background: var(--card);
      }
      .search-row input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .search-row button {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 0 24px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .search-row button:hover {
        opacity: 0.9;
      }

      .main-card {
        background: linear-gradient(135deg, #1d4ed8, #3b82f6);
        color: #fff;
        border-radius: 20px;
        padding: 32px;
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        box-shadow: 0 16px 36px rgba(29, 78, 216, 0.25);
      }
      .main-card .city-name {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .main-card .cond {
        opacity: 0.85;
        font-size: 0.9rem;
      }
      .main-card .temp {
        font-size: 3.4rem;
        font-weight: 800;
        line-height: 1;
      }
      .main-card .icon {
        font-size: 4rem;
      }
      .main-card .extra {
        display: flex;
        gap: 22px;
        margin-top: 14px;
        font-size: 0.82rem;
        opacity: 0.92;
        flex-wrap: wrap;
      }
      .main-card .extra span {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .forecast-title {
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--muted);
        font-weight: 700;
        margin-bottom: 14px;
      }
      .forecast {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 14px;
      }
      .fc-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 14px;
        text-align: center;
        transition: 0.25s;
      }
      .fc-card:hover {
        border-color: var(--accent);
        transform: translateY(-4px);
      }
      .fc-day {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .fc-icon {
        font-size: 2rem;
        margin: 6px 0;
      }
      .fc-temp {
        font-size: 1rem;
        font-weight: 600;
      }
      .fc-cond {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 4px;
      }

      footer {
        margin-top: 40px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }
      footer em {
        font-style: normal;
        font-weight: 600;
        color: var(--accent);
      }

      @media (max-width: 600px) {
        .main-card {
          padding: 24px;
        }
        .main-card .temp {
          font-size: 2.6rem;
        }
        .search-row {
          flex-direction: column;
        }
        .search-row button {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="index.html">← Kembali ke Portofolio</a>
      <h1>Langit</h1>
      <p class="sub">
        Informasi cuaca ringkas untuk beberapa kota di Indonesia.
      </p>

      <div class="search-row">
        <input
          type="text"
          id="cityInput"
          placeholder="Cari kota... (contoh: Bandung)"
        />
        <button id="searchBtn">Cari</button>
      </div>

      <div id="mainWrap"></div>
      <div class="forecast-title">Prakiraan 5 Hari Ke Depan</div>
      <div class="forecast" id="forecast"></div>

      <footer>
        Proyek demo portofolio oleh <em>Nadira Puspitasari</em>. Data cuaca
        bersifat ilustratif.
      </footer>
    </div>

    <script>
      const cities = {
        bandung: {
          name: "Bandung",
          temp: 24,
          cond: "Berawan",
          icon: "⛅",
          hum: "78%",
          wind: "8 km/j",
          press: "1012 hPa",
        },
        jakarta: {
          name: "Jakarta",
          temp: 31,
          cond: "Cerah Berawan",
          icon: "🌤️",
          hum: "65%",
          wind: "12 km/j",
          press: "1008 hPa",
        },
        yogyakarta: {
          name: "Yogyakarta",
          temp: 27,
          cond: "Hujan Ringan",
          icon: "🌧️",
          hum: "85%",
          wind: "6 km/j",
          press: "1010 hPa",
        },
        surabaya: {
          name: "Surabaya",
          temp: 33,
          cond: "Cerah",
          icon: "☀️",
          hum: "60%",
          wind: "14 km/j",
          press: "1007 hPa",
        },
        medan: {
          name: "Medan",
          temp: 29,
          cond: "Berawan Tebal",
          icon: "☁️",
          hum: "80%",
          wind: "9 km/j",
          press: "1009 hPa",
        },
      };

      const icons = ["☀️", "🌤️", "⛅", "🌧️", "☁️", "🌦️"];
      const days = [
        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat",
        "Sabtu",
        "Minggu",
      ];

      const mainWrap = document.getElementById("mainWrap");
      const forecastEl = document.getElementById("forecast");
      const cityInput = document.getElementById("cityInput");
      const searchBtn = document.getElementById("searchBtn");

      function renderMain(cityKey) {
        const c = cities[cityKey];
        if (!c) {
          mainWrap.innerHTML = `<div class="main-card" style="background:linear-gradient(135deg,#64748b,#94a3b8);justify-content:center">
      <div style="text-align:center"><div class="icon">🌍</div><div class="cond">Kota tidak ditemukan. Coba Bandung, Jakarta, Yogyakarta, Surabaya, atau Medan.</div></div>
    </div>`;
          forecastEl.innerHTML = "";
          return;
        }
        mainWrap.innerHTML = `
    <div class="main-card">
      <div>
        <div class="city-name">${c.name}</div>
        <div class="cond">${c.cond}</div>
        <div class="extra">
          <span>💧 ${c.hum}</span>
          <span>💨 ${c.wind}</span>
          <span>🌡️ ${c.press}</span>
        </div>
      </div>
      <div style="text-align:right">
        <div class="icon">${c.icon}</div>
        <div class="temp">${c.temp}°C</div>
      </div>
    </div>
  `;
        renderForecast(c.temp);
      }

      function renderForecast(baseTemp) {
        forecastEl.innerHTML = "";
        const today = new Date().getDay();
        const order = [...days.slice(today), ...days.slice(0, today)];
        for (let i = 1; i <= 5; i++) {
          const dayName = order[i % 7];
          const icon = icons[Math.floor(Math.random() * icons.length)];
          const temp = baseTemp + Math.floor(Math.random() * 6) - 3;
          const conditions = [
            "Cerah",
            "Berawan",
            "Hujan Ringan",
            "Cerah Berawan",
            "Berawan Tebal",
          ];
          const cond =
            conditions[Math.floor(Math.random() * conditions.length)];
          const card = document.createElement("div");
          card.className = "fc-card";
          card.innerHTML = `
      <div class="fc-day">${dayName}</div>
      <div class="fc-icon">${icon}</div>
      <div class="fc-temp">${temp}°C</div>
      <div class="fc-cond">${cond}</div>
    `;
          forecastEl.appendChild(card);
        }
      }

      function search() {
        const key = cityInput.value.trim().toLowerCase();
        if (!key) {
          renderMain("bandung");
          return;
        }
        renderMain(key);
      }

      searchBtn.addEventListener("click", search);
      cityInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") search();
      });

      // Default tampil Bandung
      renderMain("bandung");
    </script>
  </body>
</html>
