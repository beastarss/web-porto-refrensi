<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Todo List</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #f7f5f0;
        --card: #fff;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --accent: #c2410c;
        --border: #e8e3db;
        --soft: #fef3ec;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        padding: 32px 20px;
      }
      .wrap {
        max-width: 620px;
        margin: auto;
      }
      .back {
        display: inline-block;
        margin-bottom: 24px;
        font-size: 0.85rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      header h1 {
        font-family: Georgia, serif;
        font-size: 2rem;
        margin-bottom: 6px;
      }
      header p {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 26px;
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .input-row input {
        flex: 1;
        padding: 14px 18px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        background: var(--card);
        color: var(--ink);
      }
      .input-row input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .input-row button {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 0 24px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: 0.2s;
      }
      .input-row button:hover {
        background: #9a3412;
      }

      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .filter-btn {
        background: var(--card);
        border: 1.5px solid var(--border);
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: 0.2s;
      }
      .filter-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .stats {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 14px;
      }

      ul.todo-list {
        list-style: none;
      }
      .todo-item {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        transition: 0.2s;
      }
      .todo-item:hover {
        border-color: var(--accent);
      }
      .todo-item.done {
        opacity: 0.6;
      }
      .todo-item.done .text {
        text-decoration: line-through;
      }

      .check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: 0.2s;
        font-size: 0.7rem;
        color: transparent;
      }
      .check.checked {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .text {
        flex: 1;
        font-size: 0.95rem;
        word-break: break-word;
      }

      .priority {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding: 3px 9px;
        border-radius: 6px;
      }
      .priority.tinggi {
        background: #fee2e2;
        color: #b91c1c;
      }
      .priority.sedang {
        background: #fef3c7;
        color: #b45309;
      }
      .priority.rendah {
        background: #d1fae5;
        color: #047857;
      }

      .del {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 1.1rem;
        padding: 4px;
        transition: 0.2s;
      }
      .del:hover {
        color: #b91c1c;
      }

      .empty {
        text-align: center;
        padding: 50px 20px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 520px) {
        .input-row {
          flex-direction: column;
        }
        .input-row button {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="index.html">← Kembali ke Portofolio</a>
      <header>
        <h1>TaskFlow</h1>
        <p>Kelola tugas harianmu. Tersimpan otomatis di browser.</p>
      </header>

      <div class="input-row">
        <input type="text" id="todoInput" placeholder="Tulis tugas baru..." />
        <select
          id="prioSelect"
          style="
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            background: var(--card);
          "
        >
          <option value="rendah">Rendah</option>
          <option value="sedang" selected>Sedang</option>
          <option value="tinggi">Tinggi</option>
        </select>
        <button id="addBtn">Tambah</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="active">Belum</button>
        <button class="filter-btn" data-filter="done">Selesai</button>
      </div>

      <div class="stats">
        <span id="statText">0 tugas</span>
        <span
          id="clearDone"
          style="cursor: pointer; color: var(--accent); font-weight: 600"
          >Hapus yang selesai</span
        >
      </div>

      <ul class="todo-list" id="list"></ul>
    </div>

    <script>
      const STORAGE_KEY = "taskflow_items";
      let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      let filter = "all";

      const list = document.getElementById("list");
      const input = document.getElementById("todoInput");
      const prio = document.getElementById("prioSelect");
      const addBtn = document.getElementById("addBtn");
      const statText = document.getElementById("statText");
      const clearDone = document.getElementById("clearDone");

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      function addTodo() {
        const text = input.value.trim();
        if (!text) return;
        todos.unshift({
          id: Date.now(),
          text,
          priority: prio.value,
          done: false,
        });
        input.value = "";
        input.focus();
        save();
        render();
      }

      function toggle(id) {
        const t = todos.find((x) => x.id === id);
        if (t) {
          t.done = !t.done;
          save();
          render();
        }
      }

      function remove(id) {
        todos = todos.filter((x) => x.id !== id);
        save();
        render();
      }

      function render() {
        const filtered = todos.filter((t) => {
          if (filter === "active") return !t.done;
          if (filter === "done") return t.done;
          return true;
        });

        const doneCount = todos.filter((t) => t.done).length;
        statText.textContent = `${todos.length} tugas • ${doneCount} selesai`;

        if (filtered.length === 0) {
          list.innerHTML = `<div class="empty">Belum ada tugas di sini. Tambahkan yang baru di atas ✍️</div>`;
          return;
        }

        list.innerHTML = "";
        filtered.forEach((t) => {
          const li = document.createElement("li");
          li.className = "todo-item" + (t.done ? " done" : "");
          li.innerHTML = `
      <div class="check ${t.done ? "checked" : ""}" data-id="${t.id}">✓</div>
      <span class="text">${escapeHtml(t.text)}</span>
      <span class="priority ${t.priority}">${t.priority}</span>
      <button class="del" data-del="${t.id}" title="Hapus">✕</button>
    `;
          list.appendChild(li);
        });

        list.querySelectorAll(".check").forEach((el) => {
          el.addEventListener("click", () => toggle(Number(el.dataset.id)));
        });
        list.querySelectorAll(".del").forEach((el) => {
          el.addEventListener("click", () => remove(Number(el.dataset.del)));
        });
      }

      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      addBtn.addEventListener("click", addTodo);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTodo();
      });

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          filter = btn.dataset.filter;
          render();
        });
      });

      clearDone.addEventListener("click", () => {
        todos = todos.filter((t) => !t.done);
        save();
        render();
      });

      render();
    </script>
  </body>
</html>
